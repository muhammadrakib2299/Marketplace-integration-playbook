# Copy this example to catalog/marketplaces.yaml and replace every placeholder.
- id: marketplace-slug
  name: Marketplace name
  category: marketplace # marketplace | storefront | marketplace-operator | social-commerce | aggregator | carrier | accounting | warehouse | other
  regions:
    - country-or-region
  api_surfaces:
    - name: Official API name
      version: unknown
      docs_url: https://example.com/developers
  access_model: unknown # public | seller-account | approval-required | partner-only | mixed | private | unknown
  status: research # research | documented | tested | deprecated | blocked
  evidence: unverified # official | tested | mixed | unverified
  source_urls:
    - https://example.com/developers
  last_verified: null # YYYY-MM-DD; use null when not checked
  guide: ../marketplaces/marketplace-slug/README.md
  notes: Short, cautious scope note. Do not include unsupported API or auth claims.
  # Optional: a Simple Icons slug (https://simpleicons.org) for the marketplace's own mark.
  # Omit it when the brand is not in the installed simple-icons package; a monogram is shown instead.
  logo: marketplace-slug
  # Optional: numbered steps shown first in the sidebar, in reading order.
  build_sequence:
    - label: Connect a seller account
      href: /marketplaces/marketplace-slug/guides/authentication
  # Optional: further sidebar links (API pages, guides, changelog). Every href must have a page.
  pages:
    - label: Changelog
      href: /marketplaces/marketplace-slug/changelog
