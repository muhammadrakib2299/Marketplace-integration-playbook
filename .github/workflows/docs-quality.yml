name: Documentation quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1' # Weekly link check; GitHub schedules use UTC.

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Markdown and links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            **/*.md
            .github/**/*.md

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 2
            --retry-wait-time 2
            --timeout 30
            --root-dir "${{ github.workspace }}"
            './**/*.md'
            './.github/**/*.md'
          fail: true
          jobSummary: true
