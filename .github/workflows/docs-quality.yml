name: Documentation quality

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1' # Weekly link check; GitHub schedules use UTC.

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-api-schemas:
    name: Validate API schemas
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI and Swagger definitions
        run: npm run api:validate

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  build-site:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

  validate:
    name: Validate Markdown and links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            **/*.md
            .github/**/*.md

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # --remap checks github.com/<owner>/<repo>/blob/<ref>/<path> links through
          # raw.githubusercontent.com: GitHub answers the HTML blob pages from Actions runners
          # with intermittent 503s, while the raw endpoint still returns 404 for a missing file.
          # The action passes args through `eval`, so the remap stays in single quotes to keep
          # $1-$3 literal and the pattern and its target together as one argument.
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 2
            --retry-wait-time 2
            --timeout 30
            --root-dir "${{ github.workspace }}"
            --remap 'https://github\.com/([^/]+)/([^/]+)/blob/(.+) https://raw.githubusercontent.com/$1/$2/$3'
            './**/*.md'
            './.github/**/*.md'
          fail: true
          jobSummary: true
